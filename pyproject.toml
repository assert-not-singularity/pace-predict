[project]
name = "pace-predict"
version = "0.0.1"
description = "Estimate running pace from Garmin running dynamics for an instant, GNSS-independent watch data field."
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Niklas Puller" }]
dependencies = [
    "filterpy>=1.4.5",
    "fitdecode>=0.11.0",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pandera>=0.32.1",
    "scipy>=1.18.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pace_predict"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PL", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
# These ship no (or incomplete) type stubs for strict mode.
module = ["fitdecode.*", "pandas.*", "scipy.*", "filterpy.*"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.5",
]
